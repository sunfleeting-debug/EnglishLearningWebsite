# 六级单词速记 · 后端（Cloudflare Workers + D1）
# 部署：见 README.md
name = "cet-words-api"
main = "index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# 🔴 自定义域（2026-10-18）：sunfleeting.website 已把 NS 迁到 Cloudflare（zone active）。
# workers.dev 在国内被 DNS 污染 + SNI 阻断，直连不通；自定义域走 Cloudflare 橙云代理，
# 国内可直连。wrangler deploy 时会自动在 zone 里创建 DNS 记录。
# 前端 assets/js/config.js 的 apiBase 已同步改为 https://api.sunfleeting.website。
#
# 2026-10-18 追加：网站本体也用 Workers Static Assets 托管到同一个 Worker 上
#（先跑 python tools/build_worker_site.py 生成 worker/site/ 再 deploy）——
# custom domain 会自动建 DNS 记录，绕开「wrangler OAuth 没有 DNS 写权限」的限制；
# 网站从此直接用 https://sunfleeting.website 访问，GitHub Pages 保留作为备用入口。
routes = [
  { pattern = "api.sunfleeting.website", custom_domain = true },
  { pattern = "sunfleeting.website", custom_domain = true },
  { pattern = "www.sunfleeting.website", custom_domain = true }
]

# 静态站托管：只有 /api/* 进 Worker 逻辑，其余文件由 assets 直接服务（更快）。
[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# D1 数据库绑定（换账号重部署时：npx wrangler d1 create cet-words，把输出的 database_id 换到下面）。
# 建表：npx wrangler d1 execute cet-words --file=schema.sql --remote
[[d1_databases]]
# 🔴 binding 必须是 DB：worker/index.js 里用的是 env.DB。
# `wrangler d1 create` 提示的 binding = "cet_words" 是它自己起的默认名，别照抄。
binding = "DB"
database_name = "cet-words"
database_id = "915c6388-28d2-4e6f-a394-71982baafe86"

[vars]
# 管理员邮箱（逗号分隔）。这些邮箱注册/登录后就能看到「管理看板」。
# 注意：变量改了要重新 deploy 才生效。
# ⚠️ 这里是明文配置，仓库又是 public ⇒ 管理员邮箱会公开（本人邮箱本来也在 git 提交记录里）。
# 想藏起来就改用密钥：npx wrangler secret put ADMIN_EMAILS（secret 会覆盖同名 vars）。
ADMIN_EMAILS = "2119100068@qq.com"

# 发信（2026-10-18 起）：首选 Resend（RESEND_API_KEY 为 secret，不进 git），
# 发件人默认「英语学习站 <noreply@sunfleeting.website>」，域名已在 Resend 验证。
# Resend 失败时降级 QQ SMTP（SMTP_USER/SMTP_PASS 仍在 secrets）。改发件人显示改这里：
MAIL_FROM = "英语学习站 <noreply@sunfleeting.website>"

# 允许跨域的前端来源，逗号分隔；* 表示不限制。
# - https://sunfleeting-debug.github.io  GitHub Pages 网页端
# - https://sunfleeting.website          网站自定义域（绑定 Pages 后用）
# - https://localhost                    Capacitor Android WebView（androidScheme: https）
# - capacitor://localhost                Capacitor iOS WebView
# 这里收紧成实际来源，避免接口被别的站点拿去用。
ALLOWED_ORIGINS = "https://sunfleeting-debug.github.io,https://sunfleeting.website,https://localhost,capacitor://localhost"
